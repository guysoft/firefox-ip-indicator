name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read add-on version
        id: addon
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          tag="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$tag" ]; then
            echo "Tag v$tag does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@8 lint --self-hosted

      - name: Build
        run: npx --yes web-ext@8 build --overwrite-dest

      - name: Name artifacts
        run: |
          zip="web-ext-artifacts/ip_indicator-${{ steps.addon.outputs.version }}.zip"
          test -f "$zip"
          cp "$zip" "web-ext-artifacts/ip-indicator-${{ steps.addon.outputs.version }}.xpi"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Unsigned package for trying the add-on **before** addons.mozilla.org.

            **Desktop (temporary):** `about:debugging#/runtime/this-firefox` → Load Temporary Add-on → pick the `.zip` or `.xpi`.

            **Android:** unsigned builds do not install from a file. Use `web-ext run` over USB, or wait for an AMO-signed build.

            Firefox will refuse a permanent install of this file until Mozilla signs it.
          files: |
            web-ext-artifacts/ip_indicator-${{ steps.addon.outputs.version }}.zip
            web-ext-artifacts/ip-indicator-${{ steps.addon.outputs.version }}.xpi
